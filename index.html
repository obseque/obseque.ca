<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsèque</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navigation">
        <div class="nav-container">
            <div class="logo">Obsèque</div>
            <div class="contact-link">contact : <a href="mailto:obseque@proton.me">obseque@proton.me</a></div>
            <ul class="nav-links">
                <li><a href="#acc">ACC</a></li>
                <li><a href="#films">FILMS</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <!-- ACC SECTION -->
        <section id="acc" class="section acc-section active">
            <div class="container">
                <h1>ACC</h1>
                <div class="acc-gallery">
                    <img id="random-image" src="" alt="Random artwork" class="random-image">
                    <button class="refresh-btn" onclick="loadRandomImage()">REFRESH</button>
                </div>
            </div>
        </section>

        <!-- FILMS SECTION -->
        <section id="films" class="section films-section">
            <div class="container">
                <h1>FILMS</h1>
                <div class="films-grid" id="films-grid">
                    <!-- Films will be populated here -->
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
